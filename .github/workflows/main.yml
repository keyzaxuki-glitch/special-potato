name: Build postmarketOS miatoll (headless)

# Required repository secret: PMOS_PASSWORD (password for login user: keyza).
# Optional secrets: WIFI_SSID and WIFI_PSK. Leave WIFI_PSK empty for an open Wi-Fi network.
# Wi-Fi credentials are stored inside the rootfs image: keep this repository private.

on:
  workflow_dispatch:
    inputs:
      ui:
        description: "UI (none = headless)"
        required: true
        default: "none"
        type: string
      pmbootstrap_tag:
        description: "Versi pmbootstrap"
        required: true
        default: "3.12.1"
        type: string
      pmaports_branch:
        description: "Branch pmaports"
        required: true
        default: "v26.06"
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write

    env:
      PMOS_PASSWORD: ${{ secrets.PMOS_PASSWORD }}
      WIFI_SSID: ${{ secrets.WIFI_SSID }}
      WIFI_PSK: ${{ secrets.WIFI_PSK }}
      UI: ${{ inputs.ui }}
      PMB_TAG: ${{ inputs.pmbootstrap_tag }}
      PMA_BRANCH: ${{ inputs.pmaports_branch }}

    steps:
      - name: Validate secrets
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          exec > >(tee -a "$GITHUB_WORKSPACE/build-logs/run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.log") 2>&1
          set -euo pipefail
          if [[ -z "$PMOS_PASSWORD" ]]; then
            echo "Set the PMOS_PASSWORD repository secret first."
            exit 1
          fi
          if [[ -n "$WIFI_PSK" && -z "$WIFI_SSID" ]]; then
            echo "WIFI_PSK is set but WIFI_SSID is empty. Set both, or clear WIFI_PSK for an open Wi-Fi network."
            exit 1
          fi

      - name: Free runner disk space
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          exec > >(tee -a "$GITHUB_WORKSPACE/build-logs/run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.log") 2>&1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install host dependencies
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          exec > >(tee -a "$GITHUB_WORKSPACE/build-logs/run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.log") 2>&1
          sudo apt-get update
          sudo apt-get install -y git curl openssl procps python3 zstd e2fsprogs uuid-runtime
          sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc 2>/dev/null || true

      - name: Fetch pmbootstrap and patch boot_size check
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          exec > >(tee -a "$GITHUB_WORKSPACE/build-logs/run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.log") 2>&1
          set -euo pipefail
          git clone --depth 1 --branch "$PMB_TAG" https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          cd pmbootstrap
          echo "Selected pmbootstrap version: $(git describe --tags --always)"

          f="$(grep -rl 'def sanity_check_boot_size' pmb | head -n 1)"
          if [[ -z "$f" ]]; then
            echo "Could not find sanity_check_boot_size() in this pmbootstrap version."
            exit 1
          fi
          echo "Patching: $f"
          python3 - "$f" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          pattern = re.compile(r"(?m)^([ \t]*)def sanity_check_boot_size\b[^\n]*:\s*$")
          match = pattern.search(source)
          if not match:
              raise SystemExit("sanity_check_boot_size() signature was not recognized")
          body_start = match.end()
          following = source[body_start:body_start + 180]
          if "PMOS_ALLOW_SMALL_BOOT_SIZE" not in following:
              indent = match.group(1) + "    "
              source = (
                  source[:body_start]
                  + "\n" + indent + "# PMOS_ALLOW_SMALL_BOOT_SIZE: miatoll cache partition is smaller than 512 MiB\n"
                  + indent + "return\n"
                  + source[body_start:]
              )
              path.write_text(source)
          PY

          printf '#!/bin/sh\nexec python3 "%s/pmbootstrap.py" --config "%s/pmbootstrap.cfg" "$@"\n' "$PWD" "$HOME" \
            | sudo tee /usr/local/bin/pmbootstrap >/dev/null
          sudo chmod +x /usr/local/bin/pmbootstrap
          pmbootstrap --version

      - name: Configure pmbootstrap
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          exec > >(tee -a "$GITHUB_WORKSPACE/build-logs/run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.log") 2>&1
          set -euo pipefail
          W="$HOME/.local/var/pmbootstrap"
          mkdir -p "$W"
          echo 8 > "$W/version"

          git clone --depth 1 --branch "$PMA_BRANCH" https://gitlab.postmarketos.org/postmarketOS/pmaports.git "$HOME/pmaports"
          echo "Selected pmaports branch: $(git -C "$HOME/pmaports" branch --show-current)"
          echo "pmaports commit: $(git -C "$HOME/pmaports" rev-parse --short HEAD)"
          printf '[pmbootstrap]\naports = %s/pmaports\nwork = %s\n' "$HOME" "$W" > "$HOME/pmbootstrap.cfg"

          pmbootstrap config device xiaomi-miatoll
          # Do not set kernel=joyeuse: joyeuse is the phone variant, not a kernel package.
          # The xiaomi-miatoll device package selects the SM7125 kernel and its firmware.
          pmbootstrap config ui "$UI"
          pmbootstrap config service_manager systemd
          pmbootstrap config boot_size 256
          pmbootstrap config hostname knaxu
          pmbootstrap config user keyza
          pmbootstrap config extra_packages "openssh-server-pam,networkmanager,networkmanager-wifi,networkmanager-cli,networkmanager-systemd,dbus-systemd,wpa_supplicant,wireless-regdb,nano,htop"
          pmbootstrap config

      - name: Build image
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          exec > >(tee -a "$GITHUB_WORKSPACE/build-logs/run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.log") 2>&1
          set -euo pipefail
          pmbootstrap -y install --split --password "$PMOS_PASSWORD"
          mkdir -p out
          ROOTFS_DIR="$HOME/.local/var/pmbootstrap/chroot_native/home/pmos/rootfs"
          cp "$ROOTFS_DIR/xiaomi-miatoll-boot.img" out/
          cp "$ROOTFS_DIR/xiaomi-miatoll-root.img" out/
          ls -lh out

      - name: Patch boot image (TTY status output)
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          exec > >(tee -a "$GITHUB_WORKSPACE/build-logs/run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.log") 2>&1
          set -euo pipefail
          sudo mkdir -p /mnt/b
          sudo mount -o loop,rw out/xiaomi-miatoll-boot.img /mnt/b
          trap 'sudo umount /mnt/b 2>/dev/null || true' EXIT

          f="$(sudo find /mnt/b -path '*/loader/entries/pmos.conf' -o -name pmos.conf | head -n 1)"
          if [[ -z "$f" ]]; then
            echo "pmos.conf not found in boot image."
            exit 1
          fi
          echo "Boot entry: $f"
          sudo python3 - "$f" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          lines = path.read_text().splitlines()
          changed = False
          flags = [
              "plymouth.enable=0",
              "console=tty1",
              "loglevel=7",
              "systemd.show_status=1",
              "systemd.log_level=info",
          ]
          output = []
          for line in lines:
              if line.lstrip().startswith("options "):
                  indent = line[:len(line) - len(line.lstrip())]
                  tokens = line.strip().split()[1:]
                  tokens = [
                      token for token in tokens
                      if token != "quiet"
                      and not token.startswith((
                          "loglevel=", "plymouth.enable=", "console=",
                          "systemd.show_status=", "systemd.log_level="
                      ))
                  ]
                  line = indent + "options " + " ".join(tokens + flags)
                  changed = True
              output.append(line)
          if not changed:
              raise SystemExit("No kernel 'options' line found in pmos.conf")
          path.write_text("\n".join(output) + "\n")
          PY
          echo "--- patched boot entry ---"
          sudo cat "$f"
          sudo umount /mnt/b
          trap - EXIT

      - name: Configure rootfs (Wi-Fi, SSH, TTY service list, Ubuntu chroot)
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          exec > >(tee -a "$GITHUB_WORKSPACE/build-logs/run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.log") 2>&1
          set -euo pipefail
          R=/mnt/r
          sudo mkdir -p "$R"
          sudo mount -o loop,rw out/xiaomi-miatoll-root.img "$R"
          cleanup() { sudo umount "$R" 2>/dev/null || true; }
          trap cleanup EXIT

          echo "Systemd unit files found in rootfs:"
          sudo find "$R/usr/lib/systemd/system" "$R/lib/systemd/system" -maxdepth 1 -type f \
            \( -iname '*ssh*' -o -iname '*networkmanager*' -o -iname 'dbus*' -o -iname 'getty@.service' \) \
            -print 2>/dev/null | sort || true

          # Use the packaged OpenSSH systemd unit; do not replace it with a homemade unit.
          ssh_unit=""
          for d in usr/lib/systemd/system lib/systemd/system; do
            if [[ -f "$R/$d/sshd.service" ]]; then
              ssh_unit="/$d/sshd.service"
              break
            fi
          done
          if [[ -z "$ssh_unit" ]]; then
            echo "ERROR: packaged sshd.service is missing. Check openssh-server-pam/systemd packages."
            exit 1
          fi
          sudo install -d -o root -g root -m 0755 \
            "$R/etc/systemd/system/sshd.service.d" "$R/etc/ssh/sshd_config.d" \
            "$R/etc/systemd/system/multi-user.target.wants"
          # Generate unique host keys at first boot, immediately before sshd starts.
          sudo tee "$R/etc/systemd/system/sshd.service.d/10-hostkeys.conf" >/dev/null <<'EOF'
          [Service]
          ExecStartPre=/usr/bin/ssh-keygen -A
          EOF
          sudo ln -sfn "$ssh_unit" "$R/etc/systemd/system/multi-user.target.wants/sshd.service"
          echo "enabled packaged sshd.service: $ssh_unit"

          # Enable units only if their real unit files are present in the image.
          enable_unit() {
            unit="$1"
            target="$2"
            for d in usr/lib/systemd/system lib/systemd/system; do
              if [[ -e "$R/$d/$unit" ]]; then
                sudo mkdir -p "$R/etc/systemd/system/$target.wants"
                sudo ln -sfn "/$d/$unit" "$R/etc/systemd/system/$target.wants/$unit"
                echo "enabled: $unit"
                return 0
              fi
            done
            echo "not found (not enabled): $unit"
            return 1
          }

          # This unit is supplied by networkmanager-systemd, explicitly installed above.
          enable_unit NetworkManager.service multi-user.target || {
            echo "ERROR: NetworkManager.service is missing. Check service_manager=systemd and networkmanager-systemd package."
            exit 1
          }
          enable_unit dbus.service multi-user.target || true
          enable_unit dbus.socket sockets.target || true

          # Ensure a visible login console on tty1; this also runs the service-list profile.
          for d in usr/lib/systemd/system lib/systemd/system; do
            if [[ -e "$R/$d/getty@.service" ]]; then
              sudo mkdir -p "$R/etc/systemd/system/getty.target.wants"
              sudo ln -sfn "/$d/getty@.service" \
                "$R/etc/systemd/system/getty.target.wants/getty@tty1.service"
              echo "enabled: getty@tty1.service"
              break
            fi
          done

          # Headless default target.
          if [[ "$UI" == "none" ]]; then
            target=""
            for d in usr/lib/systemd/system lib/systemd/system; do
              if [[ -e "$R/$d/multi-user.target" ]]; then
                target="/$d/multi-user.target"
                break
              fi
            done
            if [[ -z "$target" ]]; then
              echo "ERROR: multi-user.target not found in rootfs."
              exit 1
            fi
            sudo ln -sfn "$target" "$R/etc/systemd/system/default.target"
          fi

          # Build a NetworkManager keyfile without putting SSID/PSK in the Actions log.
          sudo env WIFI_SSID="$WIFI_SSID" WIFI_PSK="$WIFI_PSK" ROOTFS="$R" python3 - <<'PY'
          import os
          import pathlib
          import re
          import uuid

          ssid = os.environ.get("WIFI_SSID", "")
          psk = os.environ.get("WIFI_PSK", "")
          rootfs = pathlib.Path(os.environ["ROOTFS"])

          if not ssid:
              print("WIFI_SSID is empty; skipping saved Wi-Fi profile.")
          else:
              if any(ord(ch) < 32 or ord(ch) == 127 for ch in ssid + psk):
                  raise SystemExit("WIFI_SSID/WIFI_PSK must not contain control characters or newlines")
              if len(ssid.encode("utf-8")) > 32:
                  raise SystemExit("WIFI_SSID is longer than the 32-byte Wi-Fi SSID limit")
              if psk and not (8 <= len(psk) <= 63 or re.fullmatch(r"[0-9a-fA-F]{64}", psk)):
                  raise SystemExit("WIFI_PSK must be 8-63 characters, or 64 hexadecimal characters")

              def escape_keyfile(value: str) -> str:
                  value = value.replace("\\", "\\\\").replace("\n", "\\n").replace("\r", "\\r").replace("\t", "\\t")
                  if value.startswith(" "):
                      value = "\\s" + value[1:]
                  if value.endswith(" "):
                      value = value[:-1] + "\\s"
                  return value

              lines = [
                  "[connection]",
                  "id=wifi-auto",
                  f"uuid={uuid.uuid4()}",
                  "type=wifi",
                  "autoconnect=true",
                  "autoconnect-priority=100",
                  "",
                  "[wifi]",
                  "mode=infrastructure",
                  f"ssid={escape_keyfile(ssid)}",
              ]
              if psk:
                  lines += [
                      "",
                      "[wifi-security]",
                      "key-mgmt=wpa-psk",
                      f"psk={escape_keyfile(psk)}",
                  ]
              lines += ["", "[ipv4]", "method=auto", "", "[ipv6]", "method=auto", ""]

              profile_dir = rootfs / "etc/NetworkManager/system-connections"
              profile_dir.mkdir(parents=True, exist_ok=True)
              profile = profile_dir / "wifi-auto.nmconnection"
              profile.write_text("\n".join(lines))
              profile.chmod(0o600)
              print("Saved NetworkManager Wi-Fi profile (credentials are not printed).")
          PY
          if [[ -n "$WIFI_SSID" ]]; then
            sudo chown root:root "$R/etc/NetworkManager/system-connections/wifi-auto.nmconnection"
          fi

          # Show the loaded/active/failed system services directly on physical tty1 at boot.
          sudo install -d "$R/usr/local/sbin" "$R/etc/systemd/system/multi-user.target.wants" \
            "$R/etc/systemd/system/getty.target.wants"
          sudo tee "$R/usr/local/sbin/miatoll-tty1-status" >/dev/null <<'EOF'
          #!/bin/sh
          printf '\033[2J\033[H'
          echo '============================================================'
          echo '             MIATOLL HEADLESS - SYSTEM STATUS'
          echo '============================================================'
          echo
          echo 'SYSTEMD: LOADED SERVICES'
          systemctl list-units --type=service --all --no-pager --plain || true
          echo
          echo 'SYSTEMD: FAILED UNITS'
          systemctl --failed --no-pager --plain || true
          echo
          echo 'NETWORK INTERFACES'
          ip -brief address 2>/dev/null || ip addr 2>/dev/null || true
          echo
          echo 'SSH SERVICE'
          systemctl --no-pager --full status sshd.service 2>&1 || true
          echo
          echo 'SSH LISTEN SOCKETS'
          ss -lnt 2>/dev/null | grep -E 'State|:22([[:space:]]|$)' || true
          echo
          echo '============================================================'
          echo 'TTY1 status snapshot; login prompt follows.'
          echo '============================================================'
          EOF
          sudo chmod 0755 "$R/usr/local/sbin/miatoll-tty1-status"
          sudo chown root:root "$R/usr/local/sbin/miatoll-tty1-status"

          sudo tee "$R/etc/systemd/system/miatoll-tty1-status.service" >/dev/null <<'EOF'
          [Unit]
          Description=Show miatoll system status on tty1 during boot
          After=systemd-journald.service NetworkManager.service sshd.service
          Wants=NetworkManager.service sshd.service
          Before=getty@tty1.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/miatoll-tty1-status
          StandardInput=tty
          StandardOutput=tty
          StandardError=journal
          TTYPath=/dev/tty1
          TTYReset=yes
          TTYVHangup=no
          TTYVTDisallocate=no
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          EOF
          sudo ln -sfn /etc/systemd/system/miatoll-tty1-status.service \
            "$R/etc/systemd/system/multi-user.target.wants/miatoll-tty1-status.service"

          # Keep a normal login prompt after the one-shot status screen.
          for d in usr/lib/systemd/system lib/systemd/system; do
            if [[ -f "$R/$d/getty@.service" ]]; then
              sudo ln -sfn "/$d/getty@.service" \
                "$R/etc/systemd/system/getty.target.wants/getty@tty1.service"
              break
            fi
          done

          # Also show the status again after a user logs in on tty1.
          sudo tee "$R/etc/profile.d/90-show-system-services.sh" >/dev/null <<'EOF'
          #!/bin/sh
          case "$-" in *i*) ;; *) return ;; esac
          [ -t 1 ] || return
          case "$(tty 2>/dev/null)" in /dev/tty1|/dev/console) ;; *) return ;; esac
          /usr/local/sbin/miatoll-tty1-status
          EOF
          sudo chmod 0644 "$R/etc/profile.d/90-show-system-services.sh"
          sudo chown root:root "$R/etc/profile.d/90-show-system-services.sh"

          # Optional Ubuntu 24.04 chroot helpers (created on first use on the phone).
          sudo install -d "$R/usr/local/bin"
          sudo tee "$R/usr/local/bin/setup-ubuntu" >/dev/null <<'EOF'
          #!/bin/sh
          set -e
          U=/opt/ubuntu
          apk add debootstrap perl binutils zstd xz wget ca-certificates
          mkdir -p "$U"
          debootstrap --arch=arm64 --variant=minbase noble "$U" http://ports.ubuntu.com/ubuntu-ports
          cat > "$U/etc/apt/sources.list" <<'LIST'
          deb http://ports.ubuntu.com/ubuntu-ports noble main universe
          deb http://ports.ubuntu.com/ubuntu-ports noble-updates main universe
          deb http://ports.ubuntu.com/ubuntu-ports noble-security main universe
          LIST
          echo "Selesai. Masuk dengan: sudo ubuntu"
          EOF
          sudo tee "$R/usr/local/bin/ubuntu" >/dev/null <<'EOF'
          #!/bin/sh
          set -e
          U=/opt/ubuntu
          [ -d "$U/etc" ] || { echo "Jalankan dulu: sudo setup-ubuntu"; exit 1; }
          mountpoint -q "$U/proc" || mount -t proc proc "$U/proc"
          mountpoint -q "$U/sys" || mount --bind /sys "$U/sys"
          mountpoint -q "$U/dev" || mount --bind /dev "$U/dev"
          mountpoint -q "$U/dev/pts" || mount --bind /dev/pts "$U/dev/pts"
          cp /etc/resolv.conf "$U/etc/resolv.conf"
          exec chroot "$U" /bin/bash -l
          EOF
          sudo chmod 0755 "$R/usr/local/bin/setup-ubuntu" "$R/usr/local/bin/ubuntu"
          sudo chown root:root "$R/usr/local/bin/setup-ubuntu" "$R/usr/local/bin/ubuntu"

          echo "Rootfs SSH/NetworkManager/TTY configuration complete."
          sudo umount "$R"
          trap - EXIT

      - name: Download U-Boot SM7125
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          exec > >(tee -a "$GITHUB_WORKSPACE/build-logs/run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.log") 2>&1
          set -euo pipefail
          curl -fL -o out/u-boot-sm7125.img \
            https://github.com/asidko/redmi-note-9s-postmarketos/releases/latest/download/u-boot-sm7125.img

      - name: Compress and checksum
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build-logs"
          exec > >(tee -a "$GITHUB_WORKSPACE/build-logs/run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.log") 2>&1
          set -euo pipefail
          cd out
          zstd -T0 -9 --rm xiaomi-miatoll-boot.img
          zstd -T0 -9 --rm xiaomi-miatoll-root.img
          sha256sum * > SHA256SUMS
          ls -lah

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pmos-${{ github.run_number }}
          name: pmOS miatoll headless
          files: out/*

      # Persist the captured workflow output in the repository, even if the build failed.
      - name: Commit workflow log to repository
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LOG_DIR="build-logs"
          LOG_FILE="$LOG_DIR/run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.log"
          mkdir -p "$LOG_DIR"
          {
            echo
            echo "===== RUN SUMMARY ====="
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Run number: $GITHUB_RUN_NUMBER"
            echo "Attempt: $GITHUB_RUN_ATTEMPT"
            echo "Event: $GITHUB_EVENT_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Ref: $GITHUB_REF"
            echo "Runner: $RUNNER_OS"
            echo "Finished at (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "===== OUTPUT FILES ====="
            find out -maxdepth 1 -type f -printf '%f %s bytes\n' 2>/dev/null | sort || true
          } >> "$LOG_FILE"

          # Do not add images, secrets, or generated credentials to the log commit.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$LOG_FILE"
          if git diff --cached --quiet; then
            echo "No log changes to commit."
            exit 0
          fi
          git commit -m "Add workflow log for run ${GITHUB_RUN_NUMBER}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
