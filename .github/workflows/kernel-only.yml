name: Build Joyeuse battery shim module

on:
  push:
    branches:
      - kernel-only-joyeuse
    paths:
      - "kernel-modules/joyeuse-battery-shim/**"
      - ".github/workflows/kernel-only.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-module:
    name: Build external module for Joyeuse
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      KERNEL_REPO: https://github.com/sm7125-mainline/linux.git
      KERNEL_TAG: sm7125-6.14.7
      EXPECTED_KERNELRELEASE: 6.14.7-sm7125
      PMAPORTS_BRANCH: v26.06
      MODULE_DIR: kernel-modules/joyeuse-battery-shim

    steps:
      - name: Checkout module repository
        uses: actions/checkout@v4

      - name: Install cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential dwarves flex gcc-aarch64-linux-gnu \
            git kmod libelf-dev libssl-dev make pahole perl python3 \
            rsync

      - name: Fetch pinned SM7125 kernel source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$KERNEL_TAG" "$KERNEL_REPO" kernel-source
          cd kernel-source
          actual_commit="$(git rev-parse HEAD)"
          expected_commit="ac499943aba5f6a7dd56d6a88952b939d9f13f6a"
          echo "Kernel source tag: $KERNEL_TAG"
          echo "Kernel source commit: $actual_commit"
          test "$actual_commit" = "$expected_commit"

      - name: Fetch postmarketOS v26.06 kernel configuration
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$PMAPORTS_BRANCH" \
            https://gitlab.postmarketos.org/postmarketOS/pmaports.git pmaports
          CONFIG_FILE="pmaports/device/testing/linux-postmarketos-qcom-sm7125/config-postmarketos-qcom-sm7125.aarch64"
          test -s "$CONFIG_FILE"
          mkdir -p kernel-out
          cp "$CONFIG_FILE" kernel-out/.config
          echo "pmaports commit: $(git -C pmaports rev-parse HEAD)"
          grep -E '^(CONFIG_LOCALVERSION=|CONFIG_MODULES=|CONFIG_MODVERSIONS=)' kernel-out/.config || true
          grep -q '^CONFIG_MODULES=y$' kernel-out/.config
          grep -q '^CONFIG_LOCALVERSION="-sm7125"$' kernel-out/.config

      - name: Configure and verify kernel release
        shell: bash
        run: |
          set -euo pipefail
          # Match the installed Joyeuse release exactly. Git-derived local
          # version suffixes (for example a trailing "+") must not be added
          # to the external module vermagic.
          kernel-source/scripts/config --file kernel-out/.config --disable LOCALVERSION_AUTO
          make -C kernel-source O="$GITHUB_WORKSPACE/kernel-out" \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          echo "Effective localversion settings:"
          grep -E '^(CONFIG_LOCALVERSION=|CONFIG_LOCALVERSION_AUTO=|# CONFIG_LOCALVERSION_AUTO is not set)' kernel-out/.config || true
          release="$(make -s -C kernel-source O="$GITHUB_WORKSPACE/kernel-out" \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease)"
          echo "Built kernel release: $release"
          if [ "$release" != "$EXPECTED_KERNELRELEASE" ]; then
            echo "::error::Kernel release mismatch: expected '$EXPECTED_KERNELRELEASE', got '$release'"
            exit 1
          fi
          echo "KERNELRELEASE=$release" >> "$GITHUB_ENV"

      - name: Build matching kernel and Module.symvers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          set -o pipefail
          make -C kernel-source O="$GITHUB_WORKSPACE/kernel-out" \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j2 Image modules 2>&1 | tee build-logs/kernel-build.log
          test -s kernel-out/Module.symvers
          test -s kernel-out/include/generated/autoconf.h
          test -s kernel-out/include/config/kernel.release
          built_release="$(cat kernel-out/include/config/kernel.release)"
          test "$built_release" = "$EXPECTED_KERNELRELEASE"

      - name: Compile joyeuse_battery_shim.ko
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          make -C kernel-source O="$GITHUB_WORKSPACE/kernel-out" \
            M="$GITHUB_WORKSPACE/$MODULE_DIR" \
            ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            modules 2>&1 | tee build-logs/module-build.log
          MODULE="$MODULE_DIR/joyeuse_battery_shim.ko"
          test -s "$MODULE"
          vermagic="$(modinfo -F vermagic "$MODULE")"
          echo "Module vermagic: $vermagic"
          test "${vermagic%% *}" = "$EXPECTED_KERNELRELEASE"
          cp "$MODULE" out/
          modinfo out/joyeuse_battery_shim.ko > out/modinfo.txt
          {
            echo "Device: Xiaomi Redmi Note 9 Pro Global (Joyeuse / SM7125)"
            echo "Architecture: aarch64"
            echo "postmarketOS target: v26.06"
            echo "Kernel release: $EXPECTED_KERNELRELEASE"
            echo "Kernel source: $KERNEL_REPO"
            echo "Kernel tag: $KERNEL_TAG"
            echo "Kernel commit: $(git -C kernel-source rev-parse HEAD)"
            echo "pmaports branch: $PMAPORTS_BRANCH"
            echo "pmaports commit: $(git -C pmaports rev-parse HEAD)"
            echo "Build date UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Module vermagic: $vermagic"
          } > out/build-info.txt
          (cd out && sha256sum joyeuse_battery_shim.ko > SHA256SUMS)
          file out/joyeuse_battery_shim.ko
          cat out/build-info.txt
          cat out/SHA256SUMS

      - name: Upload compiled module
        uses: actions/upload-artifact@v4
        with:
          name: joyeuse-battery-shim-6.14.7-sm7125-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: joyeuse-battery-shim-build-logs-${{ github.run_number }}
          path: build-logs/*.log
          if-no-files-found: warn
          retention-days: 14
